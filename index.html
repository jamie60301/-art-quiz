<style>

  }

  .screen.active { display: block; }

  }

  .login-box p { color: #666; font-size: .9rem; margin-bottom: 28px; }
  .login-box input {
    width: 100%; padding: 12px 16px; border: 1.5px solid #ddd;
    border-radius: 8px; font-size: 1rem; margin-bottom: 12px; outline: none;
  }
  .login-box input:focus { border-color: #4a90e2; }

    width: 100%; padding: 13px; background: #2c2c2c; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;

  }
  .btn-primary:hover { background: #444; }
  .error-msg { color: #e55; font-size: .85rem; margin-top: 8px; }

  .quiz-header h2 { font-size: 1.2rem; font-weight: 700; }
  .quiz-header p { font-size: .85rem; color: #888; margin-top: 4px; }
  .progress-bar { height: 4px; background: #e8e8e8; border-radius: 2px; margin-top: 12px; }
  .progress-fill { height: 100%; background: #2c2c2c; border-radius: 2px; transition: width .3s; }

  .section-label {
    font-size: .75rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: #888; margin: 28px 0 12px;
  }
  .question-card {
    background: #fff; border-radius: 12px; padding: 20px 22px;
    margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .question-card .q-num {
    font-size: .75rem; font-weight: 700; color: #aaa;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .question-card .q-text { font-size: .95rem; line-height: 1.55; margin-bottom: 16px; }
  .question-card .tag {
    display: inline-block; font-size: .7rem; font-weight: 700;
    padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
  }
  .tag-single { background: #e8f0fe; color: #1a56db; }
  .tag-multi  { background: #fef3c7; color: #92400e; }
  .tag-bool   { background: #d1fae5; color: #065f46; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-label {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border: 1.5px solid #e5e5e5;
    border-radius: 8px; cursor: pointer; transition: border-color .15s, background .15s;
    font-size: .9rem; line-height: 1.45;
  }
  .option-label:hover { border-color: #bbb; background: #fafafa; }
  .option-label input { margin-top: 2px; flex-shrink: 0; }
  .option-label.selected { border-color: #2c2c2c; background: #f0f0f0; }

  .submit-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #eee;
    padding: 14px 20px; display: flex; justify-content: center;
  }
  .btn-submit {
    background: #2c2c2c; color: #fff; border: none; border-radius: 10px;
    padding: 14px 48px; font-size: 1rem; font-weight: 700; cursor: pointer;
    max-width: 400px; width: 100%; transition: background .2s;
  }
  .btn-submit:hover { background: #444; }
  .btn-submit:disabled { background: #aaa; cursor: not-allowed; }

  /* ── RESULT ── */
  #result-screen {
    max-width: 560px; margin: 0 auto; padding: 40px 16px;
    text-align: center;
  }
  .result-box {
    background: #fff; border-radius: 16px; padding: 40px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: #2c2c2c; color: #fff;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; margin: 0 auto 24px;

  .score-circle .score-num { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .score-circle .score-den { font-size: .85rem; color: #aaa; }
  .result-box h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
  .result-box p { color: #666; margin-bottom: 24px; }
  .btn-retry {
    background: #f0f0f0; color: #333; border: none; border-radius: 8px;
    padding: 12px 32px; font-size: .95rem; font-weight: 600; cursor: pointer;
  }

  /* ── ADMIN ── */
  #admin-screen { max-width: 960px; margin: 0 auto; padding: 28px 16px; }

  .admin-table tr:not(:last-child) td { border-bottom: 1px solid #f0f0f0; }
  .admin-table tr:hover td { background: #fafafa; }
  .score-badge {
    display: inline-block; padding: 2px 10px; border-radius: 20px;

  .score-pass { background: #d1fae5; color: #065f46; }
  .score-fail { background: #fee2e2; color: #991b1b; }
  .btn-admin-back {
    margin-top: 20px; background: #f0f0f0; color: #333; border: none;
    border-radius: 8px; padding: 10px 24px; cursor: pointer; font-size: .9rem;
  }

    display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap;

  .stat-card {
    background: #fff; border-radius: 10px; padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); flex: 1; min-width: 120px;
  }
  .stat-card .stat-val { font-size: 1.6rem; font-weight: 800; }
  .stat-card .stat-label { font-size: .78rem; color: #888; }
  .loading { text-align: center; padding: 60px; color: #888; }
  .btn-refresh {
    background: #2c2c2c; color: #fff; border: none; border-radius: 8px;
    padding: 9px 20px; cursor: pointer; font-size: .88rem; font-weight: 600; margin-bottom: 16px;
  }
  .detail-link { color: #2c2c2c; cursor: pointer; text-decoration: underline; font-size: .82rem; }

  /* ── DETAIL ── */
  #detail-screen { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  #detail-screen h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }
  .detail-q { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
  .detail-q .dq-text { font-size: .9rem; margin-bottom: 10px; }
  .detail-q .dq-opts { font-size: .85rem; display: flex; flex-wrap: wrap; gap: 6px; }
  .dq-chip { padding: 3px 10px; border-radius: 5px; }
  .chip-correct { background: #d1fae5; color: #065f46; }
  .chip-wrong   { background: #fee2e2; color: #991b1b; }
  .chip-neutral { background: #f0f0f0; color: #555; }
  .dq-label { font-size: .78rem; font-weight: 700; color: #aaa; margin-bottom: 4px; }
  .btn-back {
    background: #f0f0f0; color: #333; border: none; border-radius: 8px;
    padding: 10px 24px; cursor: pointer; font-size: .9rem; margin-bottom: 20px;
  }

  @media (max-width: 500px) {
    .login-box { padding: 28px 20px; }
    .admin-table { font-size: .8rem; }
    .admin-table th, .admin-table td { padding: 9px 10px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <h1>《便利商店》美術組</h1>
    <p>核銷須知 線上測驗</p>
    <input type="text" id="login-name" placeholder="您的姓名" autocomplete="off">
    <input type="password" id="login-password" placeholder="測驗密碼" autocomplete="off">
    <button class="btn-primary" onclick="doLogin()">開始測驗</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz-screen" class="screen">
  <div class="quiz-header">
    <h2>《便利商店》美術組 核銷須知測驗</h2>
    <p>請認真作答，共 27 題</p>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div id="questions-container"></div>
  <div class="submit-bar">
    <button class="btn-submit" id="submit-btn" onclick="submitQuiz()">交卷</button>
  </div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="result-box">
    <div class="score-circle">
      <span class="score-num" id="result-score">--</span>
      <span class="score-den" id="result-den">/ 27</span>
    </div>
    <h2 id="result-name">--</h2>
    <p id="result-msg">感謝您完成測驗！</p>
    <button class="btn-retry" onclick="showScreen('login-screen'); resetQuiz()">重新測驗</button>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen" class="screen">
  <h2>管理員後台 — 測驗結果</h2>
  <div class="admin-stats" id="admin-stats"></div>
  <button class="btn-refresh" onclick="loadAdmin()">重新整理</button>
  <div id="admin-table-container"><div class="loading">載入中…</div></div>
  <button class="btn-admin-back" onclick="showScreen('login-screen')">登出</button>
</div>

<!-- DETAIL -->
<div id="detail-screen" class="screen">
  <button class="btn-back" onclick="showScreen('admin-screen')">← 返回</button>
  <h2 id="detail-title">作答詳情</h2>
  <div id="detail-container"></div>
</div>

    opts:{A:'提供工會開立之載有被保險人姓名、且清楚標註所屬繳費月份的繳費收據', B:'工會繳費證明上漏掉「被保險人姓名」', C:'僅提供職業工會會員證（此證件通常只寫加保日，無法核對當下的在保狀況）', D:'工會繳費證明上沒有明確寫出該筆會費所屬的「繳費期間（年月）」'} },

  // 是非題
  { id:19, type:'bool', text:'若發票因為漏打統編，請店家於發票上補蓋「統一發票專用章」店章，該張發票即可視為合格發票進行核銷。' },
  { id:20, type:'bool', text:'為了減少開立發票的數量，不同場景所使用的陳設道具，可以開在同一張發票內。' },
  { id:21, type:'bool', text:'計程車資在核銷時，必須附上乘車收據，除了收據上的固定資訊外，還必須用鉛筆加註搭乘起訖點、搭乘對象與搭乘事由。' },
  { id:22, type:'bool', text:'勞務報酬單簽名處，為了方便在戶外工作的同仁，可以由領款人以手機或平板「電子簽名」後列印繳交。' },
  { id:23, type:'bool', text:'ETC 通行費在報帳時，除了提供通行費繳費紀錄之外，還必須印出「過站證明」，且兩者皆必須印有遠通電收電子憑證專用章。' },
  { id:24, type:'bool', text:'開拍後的餐飲費補貼標準是早餐／宵夜 70 元、午餐／晚餐 90 元，申報時必須依照個人實際工作時間填寫餐費表。' },
  { id:25, type:'bool', text:'每週核銷的金額若很少（例如不到 100 元），可以累積多週再交給會計，不需每週回帳。' },
  { id:26, type:'bool', text:'勞務報酬單上的任何金額、個人資料，如果填寫錯誤有塗改，必須由所得人於塗改處簽名，否則該單據即為無效單據。' },
  { id:27, type:'bool', text:'外幣付款核銷，核銷金額換算依據必須以「台灣銀行歷史匯率」中的「即期買入」匯率為換算標準。' },
];

const ANSWERS = {
  1:['A'], 2:['B'], 3:['C'], 4:['C'], 5:['B'], 6:['B'], 7:['B'], 8:['A'],
  9:['A','C','D','E'], 10:['A','C','D'], 11:['A','C','D'], 12:['A','C','D'],
  13:['C'], 14:['B','C','D'], 15:['A','C','D'], 16:['A','C','D'],
  17:['A','B','D'], 18:['B','C','D'],
  19:['B'], 20:['B'], 21:['A'], 22:['B'], 23:['A'], 24:['A'],
  25:['B'], 26:['B'], 27:['B'],
};

const TAKER_PW = '60049018';
const ADMIN_PW = '5897';

let currentUser = '';
let userAnswers = {};
let allResults  = [];

/* ── HELPERS ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).style.display = '';
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress-fill').style.width = (answered / QUESTIONS.length * 100) + '%';
}

/* ── LOGIN ── */
window.doLogin = function() {
  const name = document.getElementById('login-name').value.trim();
  const pw   = document.getElementById('login-password').value.trim();
  const err  = document.getElementById('login-error');
  if (!name) { err.textContent = '請輸入您的姓名'; return; }
  if (pw === ADMIN_PW) {
    currentUser = name;
    err.textContent = '';
    showScreen('admin-screen');
    loadAdmin();
  } else if (pw === TAKER_PW) {
    currentUser = name;
    err.textContent = '';
    buildQuiz();
    showScreen('quiz-screen');
  } else {
    err.textContent = '密碼錯誤，請重試';
  }
};

document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

/* ── BUILD QUIZ ── */
function buildQuiz() {
  userAnswers = {};
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  let lastType = '';
  QUESTIONS.forEach(q => {
    if (q.type !== lastType) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = q.type === 'single' ? '單選題' : q.type === 'multi' ? '多選題' : '是非題';
      container.appendChild(lbl);
      lastType = q.type;
    }
    const card = document.createElement('div');
    card.className = 'question-card';
    const tagText = q.type === 'single' ? '單選' : q.type === 'multi' ? '複選' : '是非';
    const tagClass = q.type === 'single' ? 'tag-single' : q.type === 'multi' ? 'tag-multi' : 'tag-bool';
    let optsHTML = '';
    if (q.type === 'bool') {
      optsHTML = ['A:正確','B:錯誤'].map(o => {
        const [k,v] = o.split(':');
        return `<label class="option-label" id="lbl-${q.id}-${k}">
          <input type="radio" name="q${q.id}" value="${k}" onchange="selectAnswer(${q.id},'${k}','single')"> ${k}. ${v}
        </label>`;
      }).join('');
    } else if (q.type === 'single') {
      optsHTML = Object.entries(q.opts).map(([k,v]) => `
        <label class="option-label" id="lbl-${q.id}-${k}">
          <input type="radio" name="q${q.id}" value="${k}" onchange="selectAnswer(${q.id},'${k}','single')"> ${k}. ${v}
        </label>`).join('');
    } else {
      optsHTML = Object.entries(q.opts).map(([k,v]) => `
        <label class="option-label" id="lbl-${q.id}-${k}">
          <input type="checkbox" name="q${q.id}" value="${k}" onchange="selectAnswer(${q.id},'${k}','multi')"> ${k}. ${v}
        </label>`).join('');
    }
    card.innerHTML = `
      <div class="q-num">第 ${q.id} 題 <span class="tag ${tagClass}">${tagText}</span></div>
      <div class="q-text">${q.text}</div>
      <div class="options">${optsHTML}</div>`;
    container.appendChild(card);
  });
}

window.selectAnswer = function(qid, val, type) {
  if (type === 'single') {
    userAnswers[qid] = [val];
    QUESTIONS.find(q=>q.id===qid).opts && Object.keys(QUESTIONS.find(q=>q.id===qid).opts || {A:1,B:1}).forEach(k => {
      const lbl = document.getElementById(`lbl-${qid}-${k}`);
      if (lbl) lbl.classList.toggle('selected', k === val);
    });
    if (!QUESTIONS.find(q=>q.id===qid).opts) {
      ['A','B'].forEach(k => {
        const lbl = document.getElementById(`lbl-${qid}-${k}`);
        if (lbl) lbl.classList.toggle('selected', k === val);
      });
    }
  } else {
    if (!userAnswers[qid]) userAnswers[qid] = [];
    const set = new Set(userAnswers[qid]);
    const lbl = document.getElementById(`lbl-${qid}-${val}`);
    const cb  = lbl && lbl.querySelector('input');
    if (cb && cb.checked) { set.add(val); lbl.classList.add('selected'); }
    else                  { set.delete(val); if(lbl) lbl.classList.remove('selected'); }
    userAnswers[qid] = [...set];
  }
  updateProgress();
};

/* ── SUBMIT ── */
window.submitQuiz = async function() {
  const unanswered = QUESTIONS.filter(q => !userAnswers[q.id] || userAnswers[q.id].length === 0);
  if (unanswered.length > 0) {
    if (!confirm(`還有 ${unanswered.length} 題未作答（第 ${unanswered.map(q=>q.id).join('、')} 題），確定交卷？`)) return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  let score = 0;
  const detail = {};
  QUESTIONS.forEach(q => {
    const ans = ANSWERS[q.id].slice().sort().join(',');
    const usr = (userAnswers[q.id] || []).slice().sort().join(',');
    const correct = ans === usr;
    if (correct) score++;
    detail[q.id] = { user: userAnswers[q.id] || [], correct };
  });

  try {
    await addDoc(collection(db, 'quizResults'), {
      name: currentUser,
      score,
      total: QUESTIONS.length,
      answers: userAnswers,
      submittedAt: serverTimestamp(),
    });
  } catch(e) {
    console.error(e);
  }

  document.getElementById('result-score').textContent = score;
  document.getElementById('result-name').textContent = currentUser + ' 的成績';
  const pct = Math.round(score / QUESTIONS.length * 100);
  document.getElementById('result-msg').textContent = pct >= 80
    ? `🎉 恭喜通過！正確率 ${pct}%` : `正確率 ${pct}%，建議再複習一次核銷須知 📖`;
  showScreen('result-screen');
};

window.resetQuiz = function() {
  userAnswers = {};
  document.getElementById('login-name').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
};

/* ── ADMIN ── */
window.loadAdmin = async function() {
  document.getElementById('admin-table-container').innerHTML = '<div class="loading">載入中…</div>';
  try {
    const q   = query(collection(db, 'quizResults'), orderBy('submittedAt', 'desc'));
    const snap = await getDocs(q);
    allResults = [];
    snap.forEach(doc => allResults.push({ id: doc.id, ...doc.data() }));
    renderAdmin();
  } catch(e) {
    document.getElementById('admin-table-container').innerHTML = `<div class="loading">載入失敗：${e.message}</div>`;
  }
};

function renderAdmin() {
  const total = allResults.length;
  const avg   = total ? (allResults.reduce((s,r)=>s+r.score,0)/total).toFixed(1) : '--';
  const pass  = allResults.filter(r=>r.score/r.total>=0.8).length;

  document.getElementById('admin-stats').innerHTML = `
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-label">總作答人次</div></div>
    <div class="stat-card"><div class="stat-val">${avg}</div><div class="stat-label">平均分數</div></div>
    <div class="stat-card"><div class="stat-val">${pass}</div><div class="stat-label">通過人數（≥80%）</div></div>`;

  if (!allResults.length) {
    document.getElementById('admin-table-container').innerHTML = '<div class="loading">尚無作答紀錄</div>';
    return;
  }
  const rows = allResults.map((r,i) => {
    const pct  = Math.round(r.score / r.total * 100);
    const cls  = pct >= 80 ? 'score-pass' : 'score-fail';
    const time = r.submittedAt ? new Date(r.submittedAt.seconds*1000).toLocaleString('zh-TW') : '--';
    return `<tr>
      <td>${i+1}</td>
      <td><strong>${r.name || '--'}</strong></td>
      <td><span class="score-badge ${cls}">${r.score} / ${r.total}（${pct}%）</span></td>
      <td>${time}</td>
      <td><span class="detail-link" onclick="showDetail(${i})">查看詳情</span></td>
    </tr>`;
  }).join('');
  document.getElementById('admin-table-container').innerHTML = `
    <table class="admin-table">
      <thead><tr><th>#</th><th>姓名</th><th>成績</th><th>作答時間</th><th>詳情</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

window.showDetail = function(idx) {
  const r = allResults[idx];
  document.getElementById('detail-title').textContent = `${r.name} 的作答詳情（${r.score}/${r.total}）`;
  let html = '';
  QUESTIONS.forEach(q => {
    const ans  = ANSWERS[q.id];
    const usr  = (r.answers && r.answers[q.id]) ? r.answers[q.id] : [];
    const ok   = ans.slice().sort().join(',') === usr.slice().sort().join(',');
    const opts = q.type === 'bool' ? {A:'正確',B:'錯誤'} : (q.opts || {});
    const chips = Object.entries(opts).map(([k,v]) => {
      const inAns = ans.includes(k);
      const inUsr = usr.includes(k);
      let cls = 'chip-neutral';
      if (inAns && inUsr) cls = 'chip-correct';
      else if (!inAns && inUsr) cls = 'chip-wrong';
      else if (inAns && !inUsr) cls = 'chip-neutral';
      return `<span class="dq-chip ${cls}">${k}. ${v}</span>`;
    }).join('');
    html += `<div class="detail-q">
      <div class="dq-label">${ok ? '✅' : '❌'} 第 ${q.id} 題</div>
      <div class="dq-text">${q.text}</div>
      <div class="dq-label">正確答案：${ans.join('、')}　　作答：${usr.length ? usr.join('、') : '（未作答）'}</div>
      <div class="dq-opts">${chips}</div>
    </div>`;
  });
  document.getElementById('detail-container').innerHTML = html;
  showScreen('detail-screen');
};
</script>
