<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《便利商店》美術組 核銷須知測驗</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #f0f2f5;
  --card:      #ffffff;
  --primary:   #1e293b;
  --accent:    #3b82f6;
  --success:   #16a34a;
  --error:     #dc2626;
  --border:    #e2e8f0;
  --muted:     #64748b;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--bg); color: var(--primary); min-height: 100vh; line-height: 1.6;
}
.screen { display: none; }
.screen.active { display: block; }

/* ── Shared ── */
.card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 28px; border: none; border-radius: 10px; font-size: 1rem;
  font-weight: 600; cursor: pointer; transition: all .15s; text-decoration: none;
  font-family: inherit;
}
.btn-primary   { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #334155; }
.btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
.btn-secondary { background: var(--bg); color: var(--primary); border: 1.5px solid var(--border); }
.btn-secondary:hover { border-color: #94a3b8; }
.btn-full { width: 100%; }
input[type="text"], input[type="password"], input[type="tel"] {
  width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 1rem; outline: none; background: #fff;
  transition: border-color .15s; font-family: inherit;
  color: #1e293b; -webkit-text-fill-color: #1e293b;
}
input:focus { border-color: var(--accent); }
/* 防止 Safari autofill 把文字變透明 */
input:-webkit-autofill,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: #1e293b !important;
  -webkit-box-shadow: 0 0 0px 1000px #fff inset !important;
  transition: background-color 5000s ease-in-out 0s;
}
.err { color: var(--error); font-size: .82rem; margin-top: 6px; display: none; }

/* ── PASSWORD ── */
#screen-password.active {
  display: flex; min-height: 100vh; align-items: center;
  justify-content: center; padding: 24px;
}
#screen-password .card {
  max-width: 400px; width: 100%; text-align: center;
}
.pw-icon { font-size: 2.8rem; margin-bottom: 14px; }
.pw-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
.pw-sub { color: var(--muted); font-size: .875rem; margin-bottom: 24px; }
.pw-fields { display: flex; flex-direction: column; gap: 10px; }

/* ── COVER ── */
#screen-cover.active {
  display: flex; min-height: 100vh; align-items: center;
  justify-content: center; padding: 24px; position: relative;
}
.sun-btn {
  position: fixed; top: 14px; right: 14px; font-size: 1.4rem;
  background: none; border: none; cursor: pointer; padding: 8px;
  border-radius: 50%; transition: transform .3s; z-index: 50; line-height: 1;
}
.sun-btn:hover { transform: rotate(60deg) scale(1.1); }
.cover-card { max-width: 480px; width: 100%; }
.cover-tag {
  display: inline-block; background: #dbeafe; color: #1d4ed8;
  font-size: .7rem; font-weight: 700; padding: 3px 12px; border-radius: 20px;
  letter-spacing: .06em; margin-bottom: 14px; text-transform: uppercase;
}
.cover-title { font-size: 1.5rem; font-weight: 800; line-height: 1.3; margin-bottom: 8px; }
.cover-desc  { color: var(--muted); font-size: .875rem; margin-bottom: 20px; }
.cover-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px;
}
.stat { text-align: center; background: var(--bg); border-radius: 10px; padding: 12px 8px; }
.stat-n { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
.stat-l { font-size: .72rem; color: var(--muted); }
.cover-note {
  background: #f8fafc; border-radius: 10px; padding: 12px 14px;
  font-size: .82rem; color: var(--muted); line-height: 1.7; margin-bottom: 20px;
}
.cover-fields { display: flex; flex-direction: column; gap: 10px; }

/* ── QUIZ ── */
#screen-quiz { min-height: 100vh; padding-bottom: 90px; }
.quiz-top {
  position: sticky; top: 0; z-index: 10;
  background: rgba(240,242,245,.96); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border); padding: 10px 20px;
}
.quiz-top-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
}
.quiz-label { font-size: .8rem; color: var(--muted); font-weight: 600; }
.quiz-count { font-size: .875rem; font-weight: 700; }
.prog-bar { height: 4px; background: var(--border); border-radius: 2px; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
.quiz-body { max-width: 640px; margin: 0 auto; padding: 24px 20px; }
.q-badge {
  display: inline-block; padding: 3px 10px; border-radius: 6px;
  font-size: .72rem; font-weight: 700; letter-spacing: .04em; margin-bottom: 10px;
}
.q-single { background: #dbeafe; color: #1d4ed8; }
.q-multi  { background: #fef3c7; color: #92400e; }
.q-tf     { background: #d1fae5; color: #065f46; }
.q-text   { font-size: 1.05rem; font-weight: 600; line-height: 1.6; margin-bottom: 16px; }
.q-hint   { font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
.opts     { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 16px; border: 2px solid var(--border); border-radius: 12px;
  cursor: pointer; user-select: none; transition: border-color .12s, background .12s;
}
.opt:hover { border-color: #93c5fd; background: #f0f7ff; }
.opt.sel   { border-color: var(--accent); background: #eff6ff; }
.opt-ctrl {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  transition: all .12s;
}
.opt.sel .opt-ctrl { border-color: var(--accent); background: var(--accent); }
.opt-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; display: none; }
.opt.sel .opt-dot { display: block; }
.opt-box {
  width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  margin-top: 1px; font-size: .7rem; color: #fff; transition: all .12s;
}
.opt.sel .opt-box { border-color: var(--accent); background: var(--accent); }
.opt-text { font-size: .95rem; line-height: 1.5; flex: 1; }
.quiz-foot {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(240,242,245,.96); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border); padding: 14px 20px; z-index: 10;
}
.quiz-foot-inner { max-width: 640px; margin: 0 auto; }
#btn-next { width: 100%; }

/* ── RESULT & REPORT shared ── */
.page-wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 64px; }
.section-h {
  font-size: .95rem; font-weight: 700; display: flex; align-items: center;
  gap: 8px; margin-bottom: 14px;
}
.loading { text-align: center; padding: 48px; color: var(--muted); }
.spin {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite; margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESULT ── */
.hero {
  border-radius: 16px; padding: 36px 24px; text-align: center; color: #fff; margin-bottom: 28px;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
}
.hero-name   { font-size: .875rem; opacity: .75; margin-bottom: 6px; }
.hero-score  { font-size: 4.5rem; font-weight: 900; line-height: 1; }
.hero-total  { font-size: 1.1rem; opacity: .65; margin-bottom: 4px; }
.hero-pct    { font-size: 1.6rem; font-weight: 700; margin: 6px 0; }
.hero-badge  {
  display: inline-block; padding: 4px 18px; border-radius: 20px; font-weight: 700;
  font-size: .875rem; margin-top: 6px;
}
.badge-pass { background: rgba(34,197,94,.2); color: #4ade80; border: 1px solid rgba(74,222,128,.3); }
.badge-fail { background: rgba(239,68,68,.2); color: #f87171; border: 1px solid rgba(248,113,113,.3); }

.rank-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
.rank-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: 10px; padding: 10px 14px;
  box-shadow: var(--shadow);
}
.rank-row.me { border: 2px solid var(--accent); }
.rank-num {
  width: 28px; height: 28px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-size: .78rem;
  font-weight: 700; flex-shrink: 0;
}
.rn-gold   { background: #fde68a; color: #78350f; }
.rn-silver { background: #e2e8f0; color: #374151; }
.rn-bronze { background: #fed7aa; color: #7c2d12; }
.rank-name { flex: 1; font-weight: 600; font-size: .9rem; }
.rank-score { font-size: .85rem; font-weight: 700; background: var(--bg); padding: 2px 10px; border-radius: 6px; }

.top5-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
.top5-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow);
}
.t5-num {
  width: 32px; height: 32px; border-radius: 8px; background: #fee2e2; color: var(--error);
  font-weight: 800; font-size: .82rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.t5-info { flex: 1; min-width: 0; }
.t5-id   { font-weight: 700; font-size: .88rem; margin-bottom: 1px; }
.t5-q    { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t5-rate { font-weight: 700; color: var(--error); text-align: right; font-size: .88rem; flex-shrink: 0; }

.reviews { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
.review {
  background: var(--card); border-radius: 12px; padding: 16px 18px;
  box-shadow: var(--shadow); border-left: 4px solid var(--border);
}
.review.ok  { border-left-color: var(--success); }
.review.bad { border-left-color: var(--error); }
.rv-head    { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.rv-icon    { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }
.rv-meta    { font-size: .72rem; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.rv-q       { font-size: .9rem; font-weight: 600; line-height: 1.5; }
.rv-ans     { font-size: .83rem; margin-top: 6px; }
.rv-user    { color: var(--muted); margin-bottom: 2px; }
.rv-correct { color: var(--success); font-weight: 600; }
.rv-explain {
  font-size: .8rem; color: var(--muted); margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border); line-height: 1.65;
}
.rv-page { color: var(--accent); font-size: .77rem; margin-top: 4px; }

/* ── REPORT ── */
.rpt-section { margin-bottom: 32px; }
.rpt-title {
  font-size: 1rem; font-weight: 700; padding-bottom: 8px;
  border-bottom: 2px solid var(--border); margin-bottom: 14px;
}
.summary-grid {
  display: grid; grid-template-columns: repeat(auto-fill,minmax(130px,1fr)); gap: 10px; margin-bottom: 28px;
}
.summary-card { background: var(--card); border-radius: 12px; padding: 16px; text-align: center; box-shadow: var(--shadow); }
.sc-icon  { font-size: 1.4rem; }
.sc-val   { font-size: 1.8rem; font-weight: 800; margin: 4px 0; }
.sc-label { font-size: .72rem; color: var(--muted); }

.rank-table { width: 100%; border-collapse: collapse; }
.rank-table th { text-align: left; padding: 9px 12px; background: var(--bg); font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.rank-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: .875rem; }
.rank-table tr:last-child td { border-bottom: none; }

.bar-chart-wrap { display: flex; flex-direction: column; gap: 7px; }
.bar-row  { display: flex; align-items: center; gap: 8px; }
.bar-label{ width: 32px; font-size: .75rem; color: var(--muted); text-align: right; flex-shrink: 0; }
.bar-track{ flex: 1; height: 18px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; min-width: 2px; }
.bf-hi { background: var(--accent); }
.bf-lo { background: #f87171; }
.bar-pct  { width: 36px; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }

.hist-person { background: var(--card); border-radius: 12px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
.hist-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--bg); cursor: pointer; gap: 12px;
}
.hist-name  { font-weight: 700; font-size: .9rem; }
.hist-meta  { font-size: .78rem; color: var(--muted); }
.hist-count { font-size: .78rem; color: var(--muted); flex-shrink: 0; }
.hist-rows  { display: block; }
.hist-rows.closed { display: none; }
.hist-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 16px; border-top: 1px solid var(--border); font-size: .85rem; gap: 12px;
}
.hist-time { color: var(--muted); font-size: .78rem; }
.hist-sc   { font-weight: 700; }

/* ── MODAL ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--card); border-radius: 16px; padding: 28px; max-width: 360px; width: 100%;
  box-shadow: var(--shadow-lg); transform: scale(.95); transition: transform .2s;
}
.overlay.open .modal { transform: scale(1); }
.modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
.modal-sub   { font-size: .85rem; color: var(--muted); margin-bottom: 20px; }
.modal-form  { display: flex; flex-direction: column; gap: 10px; }
.modal-btns  { display: flex; gap: 10px; }
.modal-btns .btn { flex: 1; }

/* ── PAGE ACTIONS ── */
.page-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .quiz-body { padding: 16px 14px; }
  .page-wrap { padding: 16px 12px 64px; }
  .hero-score { font-size: 3.5rem; }
  .cover-title { font-size: 1.3rem; }
}
</style>
</head>
<body>

<!-- ══ PASSWORD ══ -->
<div id="screen-password" class="screen active" style="display:flex">
  <button class="sun-btn" onclick="openAdminModal()" title="管理員入口">☀️</button>
  <div class="card" style="max-width:400px;width:100%;text-align:center;margin:0 auto;">
    <div class="pw-icon">📋</div>
    <div class="pw-title">《便利商店》美術組</div>
    <div class="pw-sub">核銷須知 線上測驗</div>
    <div class="pw-fields">
      <input type="tel" id="pw-input" placeholder="請輸入測驗密碼" autocomplete="one-time-code" style="color:#1e293b;-webkit-text-fill-color:#1e293b;">
      <div class="err" id="pw-err">密碼錯誤，請重試</div>
      <button class="btn btn-primary btn-full" onclick="doPwSubmit()">進入</button>
    </div>
  </div>
</div>

<!-- ══ COVER ══ -->
<div id="screen-cover" class="screen" style="display:none">
  <button class="sun-btn" onclick="openAdminModal()" title="管理員入口">☀️</button>
  <div class="cover-card card">
    <div class="cover-tag">美術組 核銷須知</div>
    <h1 class="cover-title">《便利商店》美術組<br>核銷須知測驗</h1>
    <p class="cover-desc">請仔細閱讀每一題後再作答，完成後可查看詳細解析</p>
    <div class="cover-stats">
      <div class="stat"><div class="stat-n">27</div><div class="stat-l">題目總數</div></div>
      <div class="stat"><div class="stat-n">80%</div><div class="stat-l">及格標準</div></div>
    </div>
    <div class="cover-note">
      📌 本測驗包含 <strong>9 題單選</strong>、<strong>9 題多選</strong>、<strong>9 題是非</strong><br>
      📌 每題依序作答，不可跳題<br>
      📌 可重複作答，每次均記錄成績
    </div>
    <div class="cover-fields">
      <input type="text" id="cover-name" placeholder="請輸入您的姓名" autocomplete="name" style="color:#1e293b;-webkit-text-fill-color:#1e293b;">
      <div class="err" id="cover-err">請輸入您的姓名</div>
      <button class="btn btn-primary btn-full" onclick="doStartQuiz()">開始測驗</button>
    </div>
  </div>
</div>

<!-- ══ QUIZ ══ -->
<div id="screen-quiz" class="screen" style="display:none">
  <div class="quiz-top">
    <div class="quiz-top-row">
      <span class="quiz-label">便利商店 美術組</span>
      <span class="quiz-count" id="quiz-count">1 / 27</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
  <div class="quiz-foot">
    <div class="quiz-foot-inner">
      <button class="btn btn-primary" id="btn-next" onclick="doNext()" disabled>下一題</button>
    </div>
  </div>
</div>

<!-- ══ RESULT ══ -->
<div id="screen-result" class="screen" style="display:none">
  <div class="page-wrap">
    <div class="hero" id="r-hero"></div>

    <div class="section-h">📝 每題作答解析</div>
    <div class="reviews" id="r-reviews"></div>

    <div class="page-actions">
      <button class="btn btn-secondary" onclick="doGoReport()">查看完整報告</button>
      <button class="btn btn-secondary" onclick="doRetake()">重新作答</button>
    </div>
  </div>
</div>

<!-- ══ REPORT ══ -->
<div id="screen-report" class="screen" style="display:none">
  <div class="page-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
      <h1 style="font-size:1.25rem;font-weight:800;">📊 完整報告</h1>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" style="padding:8px 16px;font-size:.82rem;" onclick="loadReport()">重新整理</button>
        <button class="btn btn-secondary" style="padding:8px 16px;font-size:.82rem;" onclick="doBack()">← 返回</button>
      </div>
    </div>
    <div id="rpt-body"><div class="loading"><div class="spin"></div>載入資料中…</div></div>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div class="overlay" id="overlay-admin">
  <div class="modal">
    <div class="modal-title">🔐 管理員入口</div>
    <div class="modal-sub">請輸入管理員密碼以查看完整報告</div>
    <div class="modal-form">
      <input type="password" id="adm-pw" placeholder="管理員密碼" autocomplete="off">
      <div class="err" id="adm-err">密碼錯誤</div>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeAdminModal()">取消</button>
        <button class="btn btn-primary" onclick="doAdminLogin()">確認</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ══ FIREBASE（動態載入，避免 CDN 失敗導致整個 module 不執行） ══ */
let db = null;
let addDoc, collection, getDocs, query, orderBy, serverTimestamp, deleteDoc, firestoreDoc;

(async () => {
  try {
    const { initializeApp } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
    );
    const fs = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    );
    const app = initializeApp({
      apiKey:            "AIzaSyA2znsVNLZvoTHT1cx9gUFDyIMR6GXxS70",
      authDomain:        "quiz-5d24c.firebaseapp.com",
      projectId:         "quiz-5d24c",
      storageBucket:     "quiz-5d24c.firebasestorage.app",
      messagingSenderId: "452443218872",
      appId:             "1:452443218872:web:d735e6062adefcad6ea54d"
    });
    db              = fs.getFirestore(app);
    addDoc          = fs.addDoc;
    collection      = fs.collection;
    getDocs         = fs.getDocs;
    query           = fs.query;

    exp:'根據核銷須知第32頁，勞務報酬單上一旦有任何塗改，無論是否在塗改處簽名確認，該單據即為無效，必須重新填寫一張新的勞務報酬單。' },
  { id:27, type:'tf',
    q:'外幣付款核銷，核銷金額換算依據必須以「台灣銀行歷史匯率」中的「即期買入」匯率為換算標準。',
    opts:['正確 (True)','錯誤 (False)'],
    ans:[1], page:'p.12, p.13',
    exp:'根據核銷須知第12、13頁，外幣核銷須使用台灣銀行歷史匯率，換算基準為「即期賣出」匯率，而非「即期買入」。（公司對外採購站在買方立場，應以賣出價格計算）' },
];

/* ══ STATE ══ */
const S = {
  name:      '',
  qi:        0,       // current question index (0-based)
  answers:   Array(27).fill(0).map(()=>[]),
  submitted: null,    // { name, score, answers, submittedAt }
  subs:      [],      // all Firestore submissions
};

/* ══ SCREEN HELPERS ══ */
const FLEX_SCREENS = new Set(['screen-password','screen-cover']);
function show(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.style.display = 'none';
    s.classList.remove('active');
  });
  const el = document.getElementById(id);
  if (el) {
    el.style.display = FLEX_SCREENS.has(id) ? 'flex' : 'block';
    el.classList.add('active');
  }
  window.scrollTo(0, 0);
}
function err(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg || el.textContent;
  el.style.display = 'block';
}
function clearErr(id) { document.getElementById(id).style.display = 'none'; }

/* ══ PASSWORD ══ */
function normalizeNum(s) {
  // 全形數字（０-９）→ 半形（0-9），相容中文輸入法全形模式
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
}
window.doPwSubmit = async function() {
  const v = normalizeNum(document.getElementById('pw-input').value);
  if (v === PW_ADMIN) {
    clearErr('pw-err');
    await loadSubs();
    buildResult();
    show('screen-result');
  } else if (v === PW_TAKER) {
    clearErr('pw-err');
    show('screen-cover');
  } else {
    err('pw-err');
  }
};
/* 即時把全形數字轉半形、濾掉非數字，讓中文輸入法全形模式也能正確輸入 */
document.getElementById('pw-input').addEventListener('input', function() {
  const pos = this.selectionStart;
  const orig = this.value;
  const norm = orig
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[^0-9]/g, '');
  if (orig !== norm) {
    this.value = norm;
    /* 保持游標位置 */
    const beforeCursor = orig.slice(0, pos)
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[^0-9]/g, '');
    this.setSelectionRange(beforeCursor.length, beforeCursor.length);
  }
});
document.getElementById('pw-input').addEventListener('keydown', e => e.key === 'Enter' && doPwSubmit());

/* ══ COVER ══ */
window.doStartQuiz = function() {
  const n = document.getElementById('cover-name').value.trim();
  if (!n) { err('cover-err'); return; }
  clearErr('cover-err');
  S.name    = n;
  S.qi      = 0;
  S.answers = Array(27).fill(0).map(()=>[]);
  renderQ(0);
  show('screen-quiz');
};

/* ══ ADMIN MODAL ══ */
window.openAdminModal = function() {
  document.getElementById('adm-pw').value = '';
  clearErr('adm-err');
  document.getElementById('overlay-admin').classList.add('open');
  setTimeout(()=>document.getElementById('adm-pw').focus(), 200);
};
window.closeAdminModal = function() {
  document.getElementById('overlay-admin').classList.remove('open');
};
window.doAdminLogin = async function() {
  if (normalizeNum(document.getElementById('adm-pw').value) === PW_ADMIN) {
    closeAdminModal();
    await loadSubs();
    buildResult();
    show('screen-result');
  } else { err('adm-err'); }
};
document.getElementById('adm-pw').addEventListener('input', function() {
  const pos = this.selectionStart;
  const orig = this.value;
  const norm = orig
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[^0-9]/g, '');
  if (orig !== norm) {
    this.value = norm;
    const bc = orig.slice(0, pos)
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[^0-9]/g, '');
    this.setSelectionRange(bc.length, bc.length);
  }
});
document.getElementById('adm-pw').addEventListener('keydown', e => e.key === 'Enter' && doAdminLogin());
document.getElementById('overlay-admin').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAdminModal();
});

/* ══ QUIZ ══ */
function renderQ(i) {
  const q   = QS[i];
  const pct = Math.round(i/27*100);
  document.getElementById('quiz-count').textContent = `${i+1} / 27`;
  document.getElementById('prog-fill').style.width   = pct + '%';
  document.getElementById('btn-next').textContent   = i===26 ? '交卷' : '下一題';

  const typeLabel = {single:'單選題', multi:'多選題', tf:'是非題'}[q.type];
  const badgeCls  = {single:'q-single', multi:'q-multi', tf:'q-tf'}[q.type];
  const hint      = q.type==='multi' ? '<div class="q-hint">⚠️ 多選題，可選多個選項</div>' : '';

  const optsHtml = q.opts.map((txt, idx) => {
    const sel = S.answers[i].includes(idx);
    const ctrl = q.type==='multi'
      ? `<div class="opt-box">${sel?'✓':''}</div>`
      : `<div class="opt-ctrl"><div class="opt-dot"></div></div>`;
    return `<div class="opt${sel?' sel':''}" onclick="pickOpt(${i},${idx})">${ctrl}<span class="opt-text">${txt}</span></div>`;
  }).join('');

  document.getElementById('quiz-body').innerHTML =
    `<span class="q-badge ${badgeCls}">${typeLabel}</span>
     <div class="q-text">第 ${q.id} 題　${q.q}</div>
     ${hint}
     <div class="opts">${optsHtml}</div>`;

  document.getElementById('btn-next').disabled = S.answers[i].length === 0;
}

window.pickOpt = function(qi, oi) {
  const q = QS[qi];
  if (q.type==='single'||q.type==='tf') {
    S.answers[qi] = [oi];
  } else {
    const a = S.answers[qi]; const p = a.indexOf(oi);
    if (p===-1) a.push(oi); else a.splice(p,1);
    S.answers[qi] = [...a].sort((x,y)=>x-y);
  }
  renderQ(qi);
};

window.doNext = async function() {
  if (S.answers[S.qi].length===0) return;
  if (S.qi===26) { await doSubmit(); return; }
  S.qi++;
  renderQ(S.qi);
  window.scrollTo(0,0);
};

/* ══ SUBMIT ══ */
async function doSubmit() {
  const btn = document.getElementById('btn-next');
  btn.disabled = true; btn.textContent = '送出中…';

  let score = 0;
  QS.forEach((q,i) => { if (grade(q,S.answers[i])) score++; });

  // Firestore 不支援巢狀陣列，將每題答案序列化為逗號字串（如 "0,2"）
  const rec = { name: S.name, score, total:27, answers: S.answers.map(a=>a.join(',')), submittedAt: serverTimestamp ? serverTimestamp() : null };
  if (db) {
    try {
      await addDoc(collection(db,'quizResults'), rec);
    } catch(e) {
      console.error('addDoc failed:', e);
      alert('⚠️ 成績儲存失敗：' + (e.message||e) + '\n\n請截圖此訊息回報。');
    }
  } else {
    const reason = window._firebaseInitError ? '初始化錯誤：' + window._firebaseInitError : 'Firebase 未載入';
    alert('⚠️ 成績未儲存（' + reason + '）\n\n請截圖此訊息回報。');
  }

  // 本地 submitted 用原始陣列格式（供 buildResult 直接使用）
  S.submitted = { ...rec, answers: S.answers.map(a=>[...a]), submittedAt: new Date() };
  await loadSubs();
  buildResult();
  show('screen-result');
}

function grade(q, ua) {
  return [...q.ans].sort((a,b)=>a-b).join(',') === [...ua].sort((a,b)=>a-b).join(',');
}

/* ══ RESULT ══ */
function buildResult() {
  const d = S.submitted;
  const typeMap = {single:'單選',multi:'多選',tf:'是非'};

  if (d) {
    // 受測者模式
    const pct = Math.round(d.score/27*100);
    const pass = pct >= PASS_PCT*100;
    document.getElementById('r-hero').innerHTML =
      `<div class="hero-name">${d.name} 的測驗成績</div>
       <div class="hero-score">${d.score}</div>
       <div class="hero-total">/ 27 題</div>
       <div class="hero-pct">${pct}%</div>
       <div class="hero-badge ${pass?'badge-pass':'badge-fail'}">${pass?'🎉 及格（80% 以上）':'❌ 未及格（需達 80% 以上）'}</div>`;
    document.getElementById('r-reviews').innerHTML =
      QS.map((q,i) => {
        const ua = d.answers[i]||[];
        const ok = grade(q,ua);
        const userStr    = ua.length ? ua.map(x=>q.opts[x]).join('、') : '（未作答）';
        const correctStr = q.ans.map(x=>q.opts[x]).join('、');
        return `<div class="review ${ok?'ok':'bad'}">
          <div class="rv-head">
            <div class="rv-icon">${ok?'✅':'❌'}</div>
            <div>
              <div class="rv-meta">第 ${q.id} 題 ● ${typeMap[q.type]}</div>
              <div class="rv-q">${q.q}</div>
            </div>
          </div>
          <div class="rv-ans">
            <div class="rv-user">您的答案：${userStr}</div>
            ${!ok?`<div class="rv-correct">✓ 正確答案：${correctStr}</div>`:''}
          </div>
          <div class="rv-explain">${q.exp}<br><span class="rv-page" style="display:block;text-align:right;">出處：核銷須知 簡報版 ${q.page}</span></div>
        </div>`;
      }).join('');
  } else {
    // 管理員瀏覽模式：顯示完整題庫與正確答案
    document.getElementById('r-hero').innerHTML =
      `<div style="padding:20px 0 8px;font-size:1.05rem;font-weight:700;color:var(--text);">📋 題庫瀏覽模式</div>
       <div style="font-size:.85rem;color:var(--muted);">以下顯示所有題目、選項及正確解答</div>`;
    document.getElementById('r-reviews').innerHTML =
      QS.map(q => {
        const correctStr = q.ans.map(x=>q.opts[x]).join('、');
        const labels = ['A','B','C','D','E'];
        const optsHtml = q.opts.map((o,oi) => {
          const correct = q.ans.includes(oi);
          return `<div style="padding:6px 10px;margin:4px 0;border-radius:8px;font-size:.88rem;
            background:${correct?'rgba(34,197,94,.12)':'transparent'};
            border:1.5px solid ${correct?'#22c55e':'var(--border)'};
            color:${correct?'#16a34a':'var(--text)'};font-weight:${correct?'600':'400'};">
            ${labels[oi]}. ${o}${correct?' ✓':''}
          </div>`;
        }).join('');
        return `<div class="review ok" style="border-left:4px solid var(--accent);">
          <div class="rv-head">
            <div>
              <div class="rv-meta">第 ${q.id} 題 ● ${typeMap[q.type]}</div>
              <div class="rv-q">${q.q}</div>
              <div style="margin-top:10px;">${optsHtml}</div>
            </div>
          </div>
          <div class="rv-explain" style="margin-top:10px;">${q.exp}<br><span class="rv-page" style="display:block;text-align:right;">出處：核銷須知 簡報版 ${q.page}</span></div>
        </div>`;
      }).join('');
  }
}

function buildTop5(containerId, subs) {
  const el = document.getElementById(containerId);
  if (!subs.length) { el.innerHTML = '<p style="color:var(--muted);font-size:.85rem;padding:8px 0;">暫無足夠數據</p>'; return; }
  const rows = QS.map((q,i) => {
    const wrong = subs.filter(s=>!grade(q,s.answers[i]||[])).length;
    return { q, rate: wrong/subs.length };
  }).sort((a,b)=>b.rate-a.rate).slice(0,5);
  el.innerHTML = rows.map((r,idx)=>`
    <div class="top5-row">
      <div class="t5-num">#${idx+1}</div>
      <div class="t5-info">
        <div class="t5-id">第 ${r.q.id} 題</div>
        <div class="t5-q">${r.q.q.length>38?r.q.q.slice(0,38)+'…':r.q.q}</div>
      </div>
      <div class="t5-rate">${Math.round(r.rate*100)}%<br><span style="font-size:.7rem;font-weight:400;color:var(--muted);">錯誤率</span></div>
    </div>`).join('');
}

function buildRanks(containerId, myName) {
  const el = document.getElementById(containerId);
  if (!S.subs.length) { el.innerHTML = '<p style="color:var(--muted);font-size:.85rem;padding:8px 0;">暫無紀錄</p>'; return; }
  const best = {};
  S.subs.forEach(s => { if (!best[s.name]||s.score>best[s.name].score) best[s.name]=s; });
  const list = Object.values(best).sort((a,b)=>b.score-a.score);
  el.innerHTML = list.map((p,i)=>{
    const rc = i===0?'rn-gold':i===1?'rn-silver':i===2?'rn-bronze':'';
    const me = p.name===myName;
    return `<div class="rank-row ${me?'me':''}">
      <div class="rank-num ${rc}">${['🥇','🥈','🥉'][i]||i+1}</div>
      <div class="rank-name">${p.name}${me?' <span style="color:var(--accent);font-size:.75rem;">（你）</span>':''}</div>
      <div class="rank-score">${p.score}/27 · ${Math.round(p.score/27*100)}%</div>
    </div>`;
  }).join('');
}

/* ══ REPORT ══ */
window.loadReport = async function() {
  document.getElementById('rpt-body').innerHTML = '<div class="loading"><div class="spin"></div>載入資料中…</div>';
  await loadSubs();
  buildReport();
};

async function loadSubs() {
  if (!db) { S.subs = []; S.subsErr = 'Firebase 未連線'; return; }
  S.subsErr = null;
  try {
    const snap = await getDocs(query(collection(db,'quizResults'), orderBy('submittedAt','asc')));
    S.subs = [];
    snap.forEach(d => {
      const raw = d.data();
      // 相容舊格式（陣列）與新格式（逗號字串）
      const answers = (raw.answers||[]).map(a =>
        typeof a === 'string' ? (a==='' ? [] : a.split(',').map(Number)) : (Array.isArray(a) ? a : [])
      );
      S.subs.push({ id:d.id, ...raw, answers });
    });
  } catch(e) {
    console.error('loadSubs error:', e);
    S.subs = [];
    S.subsErr = e.message || String(e);
  }
}

function buildReport() {
  const subs = S.subs;
  if (!subs.length) {
    const errMsg = S.subsErr ? `<div style="color:#ef4444;font-size:.85rem;margin-top:8px;">⚠️ 錯誤：${S.subsErr}</div>` : '';
    document.getElementById('rpt-body').innerHTML=`<div class="loading">尚無作答紀錄${errMsg}</div>`;
    return;
  }

  const unique = [...new Set(subs.map(s=>s.name))];
  const avg    = (subs.reduce((a,b)=>a+b.score,0)/subs.length).toFixed(1);
  const passed = subs.filter(s=>s.score/27>=PASS_PCT).length;

  const best = {};
  subs.forEach(s=>{ if(!best[s.name]||s.score>best[s.name].score) best[s.name]=s; });
  const rankList = Object.values(best).sort((a,b)=>b.score-a.score);

  const acc = QS.map((q,i)=>({
    q, rate: subs.filter(s=>grade(q,s.answers[i]||[])).length/subs.length
  }));
  const top5err = [...acc].sort((a,b)=>a.rate-b.rate).slice(0,5);

  const hist = {};
  subs.forEach(s=>{ if(!hist[s.name]) hist[s.name]=[]; hist[s.name].push(s); });

  document.getElementById('rpt-body').innerHTML = `
    <!-- Summary -->
    <div class="summary-grid">
      ${[['👥',unique.length,'參與人數'],['📝',subs.length,'作答次數'],['⭐',avg,'平均分數'],['🏆',passed,'及格人次']]
        .map(([ic,v,l])=>`<div class="summary-card"><div class="sc-icon">${ic}</div><div class="sc-val">${v}</div><div class="sc-label">${l}</div></div>`).join('')}
    </div>

    <!-- Ranking -->
    <div class="rpt-section">
      <div class="rpt-title">🏆 排行榜（各人最高分）</div>
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="rank-table">
          <thead><tr><th>名次</th><th>姓名</th><th>最高分</th><th>正確率</th><th>時間</th></tr></thead>
          <tbody>${rankList.map((p,i)=>{
            const t = p.submittedAt ? new Date(p.submittedAt.seconds*1000).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '--';
            return `<tr>
              <td>${['🥇','🥈','🥉'][i]||i+1}</td>
              <td><strong>${p.name}</strong></td>
              <td><strong>${p.score}/27</strong></td>
              <td>${Math.round(p.score/27*100)}%</td>
              <td style="color:var(--muted);font-size:.78rem">${t}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>

    <!-- Bar chart -->
    <div class="rpt-section">
      <div class="rpt-title">📊 每題答對率</div>
      <div class="card">
        <div class="bar-chart-wrap">
          ${acc.map(({q,rate})=>{
            const p=Math.round(rate*100); const lo=p<50;
            return `<div class="bar-row">
              <div class="bar-label">Q${q.id}</div>
              <div class="bar-track"><div class="bar-fill ${lo?'bf-lo':'bf-hi'}" style="width:${p}%"></div></div>
              <div class="bar-pct">${p}%</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <!-- Top 5 errors -->
    <div class="rpt-section">
      <div class="rpt-title">🔥 錯誤率最高的五題</div>
      <div class="top5-list">
        ${top5err.map((r,idx)=>`
          <div class="top5-row">
            <div class="t5-num">#${idx+1}</div>
            <div class="t5-info">
              <div class="t5-id">第 ${r.q.id} 題</div>
              <div class="t5-q">${r.q.q.length>40?r.q.q.slice(0,40)+'…':r.q.q}</div>
            </div>
            <div class="t5-rate">${Math.round((1-r.rate)*100)}%<br><span style="font-size:.7rem;font-weight:400;color:var(--muted);">錯誤率</span></div>
          </div>`).join('')}
      </div>
    </div>

    <!-- Individual history -->
    <div class="rpt-section">
      <div class="rpt-title">📋 個人作答歷史</div>
      ${Object.entries(hist).map(([name,attempts])=>{
        const desc = [...attempts].sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0));
        const best = Math.max(...attempts.map(a=>a.score));
        return `<div class="hist-person">
          <div class="hist-head" onclick="this.nextElementSibling.classList.toggle('closed')">
            <div>
              <span class="hist-name">${name}</span>
              <span class="hist-meta" style="margin-left:8px">最高 ${best}/27 · ${Math.round(best/27*100)}%</span>
            </div>
            <span class="hist-count">${attempts.length} 次 ▾</span>
          </div>
          <div class="hist-rows">
            ${desc.map((a,j)=>{
              const t = a.submittedAt ? new Date(a.submittedAt.seconds*1000).toLocaleString('zh-TW') : '--';
              return `<div class="hist-row">
                <span>第 ${desc.length-j} 次</span>
                <span class="hist-sc">${a.score}/27（${Math.round(a.score/27*100)}%）</span>
                <span class="hist-time">${t}</span>
                <button onclick="deleteRecord('${a.id}')" style="margin-left:auto;padding:2px 10px;font-size:.75rem;border:1px solid #f87171;background:transparent;color:#f87171;border-radius:6px;cursor:pointer;" title="刪除此筆紀錄">🗑</button>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

/* ══ DELETE RECORD ══ */
window.deleteRecord = async function(docId) {
  if (!confirm('確定要刪除這筆作答紀錄嗎？此操作無法復原。')) return;
  if (!db || !deleteDoc || !firestoreDoc) { alert('Firebase 未連線，無法刪除'); return; }
  try {
    await deleteDoc(firestoreDoc(db, 'quizResults', docId));
    await loadReport();
  } catch(e) { alert('刪除失敗：' + e.message); }
};

/* ══ NAVIGATION ══ */
window.doGoReport = function() { loadReport(); show('screen-report'); };
window.doBack     = function() { S.submitted ? show('screen-result') : show('screen-cover'); };
window.doRetake   = function() { S.submitted = null; show('screen-cover'); };
